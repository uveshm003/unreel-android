name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          NAME="${TAG#v}"
          IFS=. read -r MAJOR MINOR PATCH <<< "${NAME%%-*}"
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Decode signing keystore (only if secrets exist)
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Signing secrets not set: attaching the debug APK instead of a signed release."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          # Secrets reach only this step; app/build.gradle.kts signs when UNREEL_KEYSTORE_PATH is non-empty.
          UNREEL_KEYSTORE_PATH: ${{ steps.signing.outputs.signed == 'true' && format('{0}/release.jks', runner.temp) || '' }}
          UNREEL_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          UNREEL_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          UNREEL_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_ARGS: -Punreel.versionName=${{ steps.version.outputs.name }} -Punreel.versionCode=${{ steps.version.outputs.code }}
        run: |
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            ./gradlew $VERSION_ARGS :app:checkNoInternetPermission :app:assembleRelease :app:bundleRelease
          else
            ./gradlew $VERSION_ARGS :app:checkNoInternetPermission :app:assembleDebug
          fi

      - name: Collect artifacts
        run: |
          mkdir -p dist
          TAG="${{ steps.version.outputs.tag }}"
          if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
            cp app/build/outputs/apk/release/app-release.apk "dist/unreel-$TAG.apk"
            cp app/build/outputs/bundle/release/app-release.aab "dist/unreel-$TAG.aab"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "dist/unreel-$TAG-debug.apk"
          fi
          (cd dist && sha256sum * > SHA256SUMS)
          ls -l dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          PRERELEASE=""
          case "$TAG" in v0.*) PRERELEASE="--prerelease" ;; esac
          gh release create "$TAG" dist/* --title "Unreel $TAG" --generate-notes $PRERELEASE --verify-tag
