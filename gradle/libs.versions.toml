[versions]
androidxAppCompat = "1.8.0"
# SDK levels (checked 2026-11-20 with sdkmanager): Android 17 / API 37 is the latest stable platform and 37.2 its
# latest stable minor SDK. Compose 1.13 (BOM 2026.11.01) requires compileSdk >= 37.1. targetSdk stays on the major.
compileSdk = "37"
compileSdkMinor = "2"
targetSdk = "37"
minSdk = "29"
jvmTarget = "17"

# Build tooling (latest stable on Maven Central / Google Maven / Gradle Plugin Portal, checked 2026-11-20)
androidGradlePlugin = "9.5.3"
kotlin = "2.4.21"
ksp = "2.3.14"
detekt = "1.23.8"
spotless = "8.12.0"
ktlint = "1.8.0"
composeRules = "0.6.8"
kover = "0.9.11"
roborazzi = "1.79.0"

# AndroidX / Google
androidxActivity = "1.13.0"
androidxBenchmark = "1.5.0"
androidxComposeAdaptive = "1.3.0"
androidxComposeNavigationSuite = "1.5.0"
androidxCore = "1.19.1"
androidxDataStore = "1.3.0"
androidxGlance = "1.2.0"
androidxHilt = "1.4.0"
androidxLifecycle = "2.11.1"
androidxNavigation = "2.10.2"
androidxProfileinstaller = "1.4.1"
androidxRoom = "2.8.5"
androidxTestCore = "1.7.0"
androidxTestEspresso = "3.7.0"
androidxTestExt = "1.3.0"
androidxTestRunner = "1.7.0"
androidxUiAutomator = "2.4.1"
androidxWork = "2.12.0"
composeBom = "2026.11.01"
hilt = "2.60.1"
vico = "3.3.1"

# Kotlin libraries
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.13.0"

# Debug / test
junit4 = "4.13.2"
leakcanary = "2.14"
robolectric = "4.18.1"
truth = "1.4.5"
turbine = "1.2.1"

